<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papeleria LAMAKINET</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Encabezado Principal -->
    <header>
        <h1>Bienvenido a La Makinet</h1>
    </header>

    <!-- Botón Buscar -->
    <div class="search-container">
        <input 
            type="text" 
            id="search-input" 
            placeholder="¿Qué página buscas?" 
            aria-label="Buscar página"
        />
        <button id="search-button">🔍</button>
        <ul id="suggestions" class="suggestions-list"></ul>
    </div>

    <!-- Navegación Principal -->
    <nav class="button-container">
        <a href="nuestras_paginas.html" class="category-button">Nuestras Páginas</a>
        <a href="educacion.html" class="category-button">Educación</a>
        <a href="salud.html" class="category-button">Salud</a>
        <a href="gobierno.html" class="category-button">Gobierno y Legal</a>
        <a href="otros.html" class="category-button">Otros</a>
        </nav>

    
    <!-- Botón para Agregar Página -->
<div class="add-page-container">
    <button id="add-page-button" data-tooltip="Agregar página">+</button>         
</div>

<!-- Botón para DESCARGAR LISTA DE PAGINAS -->
<button id="download-pages-button" class="icon-button" data-tooltip="Descargar lista">
    <i class="fa fa-download">🠋</i>
</button>

           <!-- MODAL- para Gestión de Enlaces -->
    <div id="add-page-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Añadir Página</h2>
            <form id="add-page-form">
                <label for="page-name">Nombre de la Página:</label>
                <input type="text" id="page-name" required />

                <label for="page-url">URL de la Página:</label>
                <input type="url" id="page-url" required />

                <button type="submit">Añadir</button>
            </form>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="js/scripts.js"></script>
</body>
</html>
