<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido a La Makinet</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Encabezado Principal -->
    <header>
        <h1>Bienvenido a La Makinet</h1>
    </header>

     <!-- boton buscar -->

     <div class="search-container">
        <input 
            type="text" 
            id="search-input" 
            placeholder="¿Qué página buscas?" 
            aria-label="Buscar página"
        />
        <button id="search-button">🔍</button>
        <ul id="suggestions" class="suggestions-list"></ul>
    </div>

    <!-- Navegación Principal -->
    <nav class="button-container">
        <a href="nuestras_paginas.html" class="category-button">Nuestras Paginas</a>
        <a href="educacion.html" class="category-button">Educación</a>
        <a href="salud.html" class="category-button">Salud</a>
        <a href="gobierno.html" class="category-button">Gobierno y Legal</a>
        <a href="otros.html" class="category-button">Otros</a>
    </nav>

        <!-- modal para agregar pagina -->


    <div class="add-page-container">
        <button id="add-page-button">+</button>
    </div>
    
    <div id="add-page-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Agregar Nueva Página</h2>
            <form id="add-page-form">
                <label for="page-name">Nombre:</label>
                <input type="text" id="page-name" required />
                
                <label for="page-category">Categoría:</label>
                <input type="text" id="page-category" required />
                
                <label for="page-link">Enlace:</label>
                <input type="url" id="page-link" required />
                
                <button type="submit">Agregar Página</button>
            </form>
        </div>
    </div>
       

    <!-- Scripts -->
    <script src="js/scripts.js"></script>
</body>
</html>
